name: Java CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # 3. Download JUnit and JaCoCo
      - name: Download Testing & Coverage Tools
        run: |
          mkdir -p tools

          curl -fLsS --retry 3 \
            https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar \
            -o tools/junit-platform-standalone.jar

          curl -fLsS --retry 3 \
            https://repo.maven.apache.org/maven2/org/jacoco/org.jacoco.agent/0.8.12/org.jacoco.agent-0.8.12-runtime.jar \
            -o tools/jacocoagent.jar

          curl -fLsS --retry 3 \
            https://repo.maven.apache.org/maven2/org/jacoco/org.jacoco.cli/0.8.12/org.jacoco.cli-0.8.12-nodeps.jar \
            -o tools/jacococli.jar

      # 4. Compile all Java sources into bin/
      - name: Compile Java Files
        run: |
          mkdir -p bin

          find . -name "*.java" \
            -not -path "./.git/*" \
            -not -path "./bin/*" \
            -not -path "./tools/*" \
            > sources.txt

          javac -d bin \
            -cp "tools/junit-platform-standalone.jar" \
            @sources.txt

      # 5. Run JUnit 5 tests and collect coverage
      - name: Run JUnit 5 Tests with Coverage Agent
        run: |
          mkdir -p test-results

          java \
            -javaagent:tools/jacocoagent.jar=destfile=jacoco.exec \
            -jar tools/junit-platform-standalone.jar execute \
            --class-path bin \
            --scan-class-path \
            --reports-dir=test-results

      # 6. Publish individual test results to GitHub
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Suite Results
          path: test-results/TEST-*.xml
          reporter: java-junit

      # 7. Generate JaCoCo XML coverage report
      - name: Generate Code Coverage XML Report
        if: always()
        run: |
          if [ -f jacoco.exec ] && [ -d bin ]; then
            java -jar tools/jacococli.jar report jacoco.exec \
              --classfiles bin \
              --sourcefiles . \
              --xml jacoco.xml
          else
            echo "Missing JaCoCo execution data or bin directory."
            exit 1
          fi

      # 8. Publish coverage percentages to the GitHub Actions summary
      - name: Publish JaCoCo Coverage Summary
        if: always() && hashFiles('jacoco.xml') != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("jacoco.xml").getroot()
          counters = {}

          for counter in root.findall("counter"):
              kind = counter.attrib["type"]
              missed = int(counter.attrib["missed"])
              covered = int(counter.attrib["covered"])
              counters[kind] = (missed, covered)

          summary = ["## JaCoCo Code Coverage", ""]

          for kind in ("INSTRUCTION", "BRANCH", "LINE", "METHOD", "CLASS"):
              if kind not in counters:
                  continue

              missed, covered = counters[kind]
              total = missed + covered
              percent = covered / total * 100 if total else 100.0

              summary.append(
                  f"- **{kind.title()} coverage:** "
                  f"{percent:.2f}% ({covered}/{total})"
              )

          summary += ["", "Generated from `jacoco.xml`."]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(summary) + "\n")
          PY
